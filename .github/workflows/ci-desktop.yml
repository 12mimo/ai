name: CI Desktop

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/ci-desktop.yml'
  push:
    branches: ["**"]

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          if [ -f apps/desktop/package.json ]; then
            cd apps/desktop
            npm ci
            npm run build --if-present
          else
            echo "apps/desktop/package.json not found, skipping desktop checks"
          fi
